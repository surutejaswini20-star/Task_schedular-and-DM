services:
  - type: web
    name: taskscheduler-deadlinemanager-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: TaskScheduler and DeadlineManager
      - key: DISPOSABLE_EMAIL_DOMAINS
        value: ""
  - type: worker
    name: taskscheduler-deadlinemanager-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A tasks.celery worker --loglevel=INFO --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: TaskScheduler and DeadlineManager
      - key: DISPOSABLE_EMAIL_DOMAINS
        value: ""
  - type: worker
    name: taskscheduler-deadlinemanager-beat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A tasks.celery beat --loglevel=INFO
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
